name: CI

on:
  push:
    branches: [dev, main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "Makefile"
      - ".pre-commit-config.yaml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [dev, main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "Makefile"
      - ".pre-commit-config.yaml"
      - ".github/workflows/ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for large files in diff
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: origin/dev
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin dev --depth=1
            base_ref="$BASE_REF"
          else
            base_ref="$BEFORE_SHA"
          fi

          if [ -n "$base_ref" ] && git rev-parse "$base_ref" >/dev/null 2>&1; then
            diff_files=$(git diff --name-only --diff-filter=AM "$base_ref" HEAD 2>/dev/null)
            for f in $diff_files; do
              if [ -f "$f" ]; then
                size=$(stat -c%s "$f" 2>/dev/null)
                if [ "$size" -gt 1048576 ]; then
                  echo "ERROR: $f exceeds 1 MB ($(numfmt --to=iec $size))"
                  exit 1
                fi
              fi
            done
            echo "Large file check passed."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: |
          uv sync --extra dev
          uv pip install -e .

      - name: Run quality gates
        run: make ci

      # Fast model tests (graph + prior predictive) run without coverage
      # to avoid overwriting coverage.xml from make ci. Slow MCMC tests
      # (convergence + sanity) run nightly via .github/workflows/slow-tests.yml.
      # The bash conditional skips gracefully until tests/test_model.py is
      # created in SPEC-06.
      - name: Run fast model tests
        run: |
          if [ -f tests/test_model.py ]; then
            uv run pytest tests/test_model.py -v -m "not slow" -p no:cov
          else
            echo "tests/test_model.py not found — skipping (SPEC-06 not yet implemented)"
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7
          if-no-files-found: warn

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
