name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff format --check src/ tests/
      - run: uv run ruff check src/ tests/
      - run: uv run pyright src/
      - run: uv run pytest tests/ -v --ignore=tests/test_model.py
      - run: uv run pip-audit
      - run: uv run bandit -c pyproject.toml -r src/

  model-tests:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf # v3
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run pytest tests/test_model.py -v -m "not slow"
      - run: uv run pytest tests/test_model.py -v -m "slow"
        continue-on-error: true
