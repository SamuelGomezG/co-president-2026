name: CI - Quality (Security & Code Quality)

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            code:
              - "src/**"
              - "tests/**"
              - "pyproject.toml"
              - "uv.lock"

  security:
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: |
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          needs.changes.outputs.code == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - if: |
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          needs.changes.outputs.code == 'true'
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - if: |
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          needs.changes.outputs.code == 'true'
        run: uv python install
      - if: |
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          needs.changes.outputs.code == 'true'
        run: uv sync --extra dev
      - if: |
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          needs.changes.outputs.code == 'true'
        run: uv run pip install --upgrade pip==26.1.2
      - if: |
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          needs.changes.outputs.code == 'true'
        run: uv run pip-audit --skip-editable --ignore-vuln CVE-2025-3000 --ignore-vuln PYSEC-2026-196
      - if: |
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          needs.changes.outputs.code == 'true'
        run: uv run bandit -c pyproject.toml -r src/
