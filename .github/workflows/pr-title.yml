name: PR Title Lint

on:
  pull_request_target:
    types: [opened, edited, synchronize]
    branches: [dev, main]

permissions:
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            test
            docs
            refactor
            data
            ci
            sec
          requireScope: false
