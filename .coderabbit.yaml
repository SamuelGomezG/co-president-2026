# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false
reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "dev"
  tools:
    clippy:
      enabled: true
    actionlint:
      enabled: true
    github-checks:
      enabled: true
chat:
  auto_reply: true
