[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "co-president"
version = "0.1.0"
description = "Bayesian presidential election forecast for Colombia using polling data"
readme = "MVP_SPECS_GUIDE.md"
requires-python = "~=3.12.13"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pymc>=5.15",
    "arviz>=0.18",
    "matplotlib>=3.8",
    "pyarrow>=15.0",
    "sodapy>=2.2",
    "tenacity>=8.2",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "playwright>=1.40",
    "pymupdf>=1.24",
    "pdfplumber>=0.10",
    "openpyxl>=3.1",
    "openai>=1.30",
    "pysentimiento>=0.7.3",
    "pytrends>=4.9",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "transformers>=4.40",
    "cryptography>=48.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "ruff>=0.4",
    "pyright>=1.1",
    "pandas-stubs>=2.2",
    "pre-commit>=3.8",
    "pip-audit>=2.7",
    "bandit>=1.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/co_president"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["notebooks", ".venv", ".agents", ".claude"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D100",     # Missing module docstring — module layout and usage are documented in MVP_SPECS_GUIDE.md; only functions/classes get docstrings
    "D104",     # Missing package docstring — __init__.py files are minimal stubs
    "D203",     # Conflicts with D211 (Google-style blank line before class)
    "D213",     # Conflicts with D212 (Google-style summary on first line)
    "COM812",   # Conflicts with ruff format trailing comma handling; intentional with isort force-sort-within-sections
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "N806", "PT019", "RUF002", "RUF003", "SLF001"]
"src/co_president/benchmarks/transforms.py" = ["N803", "N806", "PLR2004"]
"src/co_president/benchmarks/fnn_clr.py" = ["N803", "N806", "TC002"]
"src/co_president/benchmarks/runner.py" = [
    "N803", "N806", "D401", "PLR0913", "PLR2004", "T201", "RUF002",
]
"src/co_president/ingestion/llm_sentiment.py" = ["BLE001"]
"src/co_president/ingestion/bert_sentiment.py" = ["BLE001"]
"src/co_president/validation/__init__.py" = ["BLE001"]
"src/co_president/validation/municipal_oos.py" = ["BLE001"]
"src/co_president/model_municipal.py" = ["PGH003", "PD013"]
"src/co_president/model_round1.py" = ["PGH003", "PD013"]
"src/co_president/model_runoff_simple.py" = ["PGH003", "PD013"]
"src/co_president/model_runoff_matrix.py" = ["PGH003"]
"src/co_president/model_transfer.py" = ["PGH003"]
"src/co_president/plotting.py" = ["PGH003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["co_president"]
force-sort-within-sections = true

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = true
reportMissingImports = true
reportUnusedImport = true
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.coverage.run]
source = ["src/co_president"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
]
markers = [
    "slow: slow MCMC tests (excluded from CI)",
    "integration: tests requiring full production CSV datasets",
]
