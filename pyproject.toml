[project]
name = "co-president"
version = "0.1.0"
description = "Bayesian presidential election forecast for Colombia using polling data"
readme = "MVP_SPECS_GUIDE.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pymc>=5.15",
    "arviz>=0.18",
    "matplotlib>=3.8",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "pyright>=1.1",
    "pandas-stubs>=2.2",
    "pre-commit>=3.8",
    "pip-audit>=2.7",
    "bandit>=1.7",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["notebooks", ".venv"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D100",
    "D104",
    "S101",
    "D203",
    "D213",
    "COM812",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["co_president"]
force-sort-within-sections = true

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = true
reportMissingImports = true
reportUnusedImport = true
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.coverage.run]
source = ["src/co_president"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=src/co_president",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
markers = [
    "slow: slow MCMC tests (excluded from CI)",
]
