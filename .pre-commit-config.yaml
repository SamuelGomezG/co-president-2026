repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff-format
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: uv run pyright src/
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-fast
        name: pytest-fast
        entry: uv run pytest tests/ -v --ignore=tests/test_model.py -x
        language: system
        pass_filenames: false
        files: ^(src/co_president/|tests/).*\.py$

      - id: large-files
        name: check for large files
        entry: bash -c 'for f in "$@"; do case "$f" in data/2022-presidential-results/*|data/raw/cedae/*|data/fundamentals/*) continue;; esac; if [ $(stat -c%s "$f") -gt 1048576 ]; then echo "$f exceeds 1MB"; exit 1; fi; done' --
        language: system
        types: [file]
